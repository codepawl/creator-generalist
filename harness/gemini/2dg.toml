description = "Build 2D explainer maps, timelines, charts and archival collage with the 2d-generalist skill"
prompt = """
Activate the 2d-generalist skill and follow it from the start for this request:

{{args}}

If the request is empty or is "help", list the eight modes below and ask what 2D content the user wants to build. Otherwise, if the first word is a mode, use that mode and drop the word from the subject.

Modes: vox-now (the current measured Vox look: footage-led, empty frames, still holds, hard cuts; read first for a Vox look), script (title, hook, structure, voice pace, beat table, captions), photos (real photos and documents found online, picked from a numbered sheet, credited), map (animated 2D or 2.5D map with routes that draw on, extruded regions and 3D terrain), chart-timeline (true-scale ruler timeline, bar and line charts, dot grids, waveforms), archival-collage (newspaper zooms, highlighter marks, 2.5D parallax photos; torn paper as a stylised option), design (style frame with hierarchy, flat paper cards, palette and type pairs), audit (checks the free tools and prints install commands for missing ones).

Before building, run the intent brief in the skill (references/intent-brief.md): ask only about the purpose, format, subject, look or constraints the request leaves open, at most 4 questions with options and a recommended default, then restate the goal and show a cheap preview before the expensive step.
"""
